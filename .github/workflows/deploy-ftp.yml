name: Deploy Cometa Nordestino

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Build do Next.js
        run: npx next build

      - name: 🔍 Verificar diretório de saída
        run: |
          if [ -d "out" ]; then
            echo "✅ Pasta 'out' encontrada com sucesso."
            ls -la out
          else
            echo "❌ ERRO: Pasta 'out' não encontrada! Listando arquivos da raiz para debug:"
            ls -la
            exit 1
          fi

      - name: 🚀 Deploy via FTP para UFRN
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cometanordestino.ect.ufrn.br
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: ./public_html/
          dangerous-clean-slate: false