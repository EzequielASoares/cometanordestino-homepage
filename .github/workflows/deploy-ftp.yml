name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Usando a 22 para dar match com o Next 16
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # npm ci é mais seguro para automação que o npm install

      - name: Build Next.js
        run: npm run build

      - name: Debug - List files
        run: ls -la # Isso vai nos mostrar se a pasta 'out' apareceu mesmo

      - name: Deploy to UFRN
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cometanordestino.ect.ufrn.br
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          dangerous-clean-slate: false # Evita que ele delete coisas importantes por erro